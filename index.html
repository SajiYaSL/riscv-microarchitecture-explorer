    <script>
      try {
        const saved = JSON.parse(localStorage.getItem('rvmx-settings-v2') || 'null');
        const previous = localStorage.getItem('rvmx-theme');
        const valid = value => ['dark', 'light', 'contrast'].includes(value);
        document.documentElement.dataset.theme = valid(saved?.theme) ? saved.theme : valid(previous) ? previous : matchMedia('(prefers-contrast: more)').matches ? 'contrast' : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      } catch { /* The application still works without browser storage. */ }
    </script>
